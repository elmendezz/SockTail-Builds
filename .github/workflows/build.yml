# Version: 2
# Changelog:
# - v1: Creación inicial del workflow para compilar según las opciones de Make (compilaciones individuales y multiplataforma con llaves y Headscale).
# - v2: Corrección para repositorios públicos. El flujo automático solo ejecuta 'make build' sin exponer llaves ni requerir secrets. Las llaves solo se inyectan en ejecuciones manuales seguras.

name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de Build a ejecutar'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - build-with-key
          - build-with-config
          - build-all-with-key
          - build-all-with-config
      custom_auth_key:
        description: 'AUTH_KEY (Opcional - Uso personal)'
        required: false
        type: string
      custom_control_url:
        description: 'CONTROL_URL (Opcional - Uso personal)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar entorno Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'
          cache: true

      - name: Determinar comando y variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Ejecución manual: Usa las llaves introducidas o busca en los Secrets
            echo "MAKE_TARGET=${{ inputs.build_type }}" >> $GITHUB_ENV
            
            if [ -n "${{ inputs.custom_auth_key }}" ]; then
              echo "AUTH_KEY=${{ inputs.custom_auth_key }}" >> $GITHUB_ENV
            else
              echo "AUTH_KEY=${{ secrets.AUTH_KEY }}" >> $GITHUB_ENV
            fi

            if [ -n "${{ inputs.custom_control_url }}" ]; then
              echo "CONTROL_URL=${{ inputs.custom_control_url }}" >> $GITHUB_ENV
            else
              echo "CONTROL_URL=${{ secrets.CONTROL_URL }}" >> $GITHUB_ENV
            fi
          else
            # Ejecución automática (Push/PR en repo público):
            # Solamente compilación pública sin credenciales
            echo "MAKE_TARGET=build" >> $GITHUB_ENV
            echo "AUTH_KEY=" >> $GITHUB_ENV
            echo "CONTROL_URL=" >> $GITHUB_ENV
          fi

      - name: Ejecutar Compilación
        run: |
          echo "Ejecutando target: $MAKE_TARGET"
          make $MAKE_TARGET AUTH_KEY="${{ env.AUTH_KEY }}" CONTROL_URL="${{ env.CONTROL_URL }}"

      - name: Subir artefactos compilados
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ github.sha }}
          path: |
            bin/
            dist/
            *.exe
            *.tar.gz
          if-no-files-found: warn
